name: Verify hardening
on:
  push:
    branches: [production-hardening, main, release/matrixkeep-cloud-run]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      website_workflow_install: ${{ steps.install.outputs.only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: install
        name: Identify website-only workflow installation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ $BEFORE == 3537ef8a033978d5195677b7993b72811c68436d ]] &&
             [[ $(git diff --name-only "$BEFORE" HEAD) == "$(printf '%s\n' .github/workflows/promote.yml .github/workflows/verify.yml deploy/website-only.sh)" ]]; then
            echo 'only=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Transactional email tests
        run: |
          node --test server/email/email.test.mjs
          python -m unittest discover -s server/email -p test_smtp.py
      - name: Product tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Security tests
        if: ${{ !cancelled() }}
        run: npm run test:security
      - name: Database permissions and billing tests
        if: ${{ !cancelled() }}
        run: npm run test:database
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: bun audit --audit-level high
      - name: Build Node runtime
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Verify the release container starts as non-root
        run: |
          docker build --target runtime -t matrixkeep-ci:web .
          docker run --rm matrixkeep-ci:web sh -ec 'test "$(id -u)" != 0 && test -f .output/server/index.mjs && node -e "require.resolve(\"ws\"); require.resolve(\"@supabase/supabase-js\")"'
          docker run -d --name matrixkeep-ci -p 127.0.0.1:8080:8080 \
            -e PORT=8080 -e APP_ENV=test -e APP_ORIGIN=http://127.0.0.1:8080 \
            -e SUPABASE_URL=http://127.0.0.1:9 -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-only -e STRIPE_ENVIRONMENT=sandbox -e PAYMENTS_ENABLED=false matrixkeep-ci:web
          trap 'docker rm -f matrixkeep-ci >/dev/null' EXIT
          curl --fail --retry 12 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/health/live
          [[ $(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready) == 503 ]]
          for route in / /pricing /auth /super-admin/login /matrixkeep-config.js; do
            [[ $(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$route") == 200 ]]
          done
          docker build --target migrator -t matrixkeep-ci:migrator .
          docker run --rm matrixkeep-ci:migrator node -e "require.resolve('drizzle-orm/postgres-js/migrator');require.resolve('postgres')"

  staging:
    needs: verify
    if: needs.verify.outputs.website_workflow_install != 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/matrixkeep-cloud-run')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      MATRIXKEEP_MAIL_WORKER_ENABLED: ${{ vars.MATRIXKEEP_MAIL_WORKER_ENABLED }}
      MATRIXKEEP_MAIL_QA_RECIPIENT: ${{ vars.MATRIXKEEP_MAIL_QA_RECIPIENT }}
      APP_ENV: staging
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      EXPECTED_SUPABASE_REF: cdfpupivjjamhvmfcvry
      MAX_INSTANCES: ${{ vars.MAX_INSTANCES || '3' }}
      CONCURRENCY: ${{ vars.RUN_CONCURRENCY || '8' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check MatrixKeep federation settings
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -n "$GCP_PROJECT_ID" ]] || missing+=(GCP_PROJECT_ID)
          [[ -n "$PROVIDER" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "$DEPLOYER" ]] || missing+=(GCP_DEPLOY_SERVICE_ACCOUNT)
          if (( ${#missing[@]} )); then
            echo "::error::Missing MatrixKeep staging environment variables: ${missing[*]}"
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect staging mail secret version metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ $GCP_PROJECT_ID == matrixkeep-staging ]]
          names=(MAIL_DATABASE_URL MATRIXKEEP_SMTP_HOST MATRIXKEEP_SMTP_PORT MATRIXKEEP_SMTP_USER MATRIXKEEP_SMTP_PASSWORD)
          if ! known=$(gcloud secrets list --project="$GCP_PROJECT_ID" --format='value(name)' 2>/dev/null | sed 's|.*/||'); then
            printf '%s NO ACCESS\n' "${names[@]}"
            exit 0
          fi
          for name in "${names[@]}"; do
            if ! grep -Fxq "$name" <<< "$known"; then
              printf '%s NO ENABLED VERSION\n' "$name"
            elif versions=$(gcloud secrets versions list "$name" --project="$GCP_PROJECT_ID" --filter='state=ENABLED' --limit=1 --format='value(name)' 2>/dev/null); then
              if [[ -n $versions ]]; then echo "$name ENABLED"; else echo "$name NO ENABLED VERSION"; fi
            else
              printf '%s NO ACCESS\n' "$name"
            fi
          done
      - name: Deploy and exercise the staging mail job only
        if: (github.ref == 'refs/heads/release/matrixkeep-cloud-run' && startsWith(github.event.head_commit.message, '[staging-mail-only]')) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[mail-worker-release]'))
        shell: bash
        run: |
          set -euo pipefail
          [[ $GCP_PROJECT_ID == matrixkeep-staging && $REGION == europe-west2 ]]
          export MATRIXKEEP_MAIL_QA_RECIPIENT=metrixkeepai+emailqa20261126@gmail.com
          registry="$REGION-docker.pkg.dev/$GCP_PROJECT_ID/matrixkeep"
          common=(--project="$GCP_PROJECT_ID" --region="$REGION" --quiet)
          mail_identity="matrixkeep-mail@$GCP_PROJECT_ID.iam.gserviceaccount.com"
          gcloud iam service-accounts describe "$mail_identity" --project="$GCP_PROJECT_ID" --format='value(email)'
          enabled_version() {
            gcloud secrets versions list "$1" --project="$GCP_PROJECT_ID" --filter='state=ENABLED' --format='value(name)' |
              awk -F/ '{print $NF}' | sort -nr | sed -n '1p'
          }
          for name in MAIL_DATABASE_URL MATRIXKEEP_SMTP_HOST MATRIXKEEP_SMTP_PORT MATRIXKEEP_SMTP_USER MATRIXKEEP_SMTP_PASSWORD; do
            version=$(enabled_version "$name")
            [[ $version =~ ^[1-9][0-9]*$ ]] || { echo "::error::Missing enabled version for $name"; exit 1; }
            echo "$name version $version"
            policy=$(gcloud secrets get-iam-policy "$name" --project="$GCP_PROJECT_ID" --format=json)
            if ! jq -e --arg m "serviceAccount:$mail_identity" '.bindings[] | select(.role=="roles/secretmanager.secretAccessor" and (.condition==null)) | .members | index($m)!=null' <<<"$policy" >/dev/null; then
              gcloud secrets add-iam-policy-binding "$name" --project="$GCP_PROJECT_ID" --member="serviceAccount:$mail_identity" --role=roles/secretmanager.secretAccessor --condition=None --quiet --format=none
            fi
          done
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          mig="$registry/migrator:$GITHUB_SHA"
          docker build --target migrator --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$mig" .
          docker push "$mig"
          digest=$(gcloud artifacts docker images describe "$mig" --format='value(image_summary.digest)')
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          db_version=$(enabled_version DATABASE_MIGRATION_URL)
          [[ $db_version =~ ^[1-9][0-9]*$ ]]
          if ! gcloud run jobs deploy matrixkeep-staging-migrate "${common[@]}" --image="$registry/migrator@$digest" \
            --service-account="matrixkeep-migrator@$GCP_PROJECT_ID.iam.gserviceaccount.com" --tasks=1 --max-retries=0 \
            --set-secrets="DATABASE_MIGRATION_URL=DATABASE_MIGRATION_URL:$db_version" \
            --set-env-vars="APP_ENV=staging,EXPECTED_SUPABASE_REF=cdfpupivjjamhvmfcvry" --execute-now --wait; then
            execution=$(gcloud run jobs describe matrixkeep-staging-migrate "${common[@]}" --format='value(status.latestCreatedExecution.name)')
            [[ $execution =~ ^matrixkeep-staging-migrate-[a-z0-9]+$ ]]
            echo "Failed staging migration execution: $execution"
            gcloud logging read "resource.type=cloud_run_job AND labels.\"run.googleapis.com/execution_name\"=\"$execution\"" \
              --project="$GCP_PROJECT_ID" --limit=30 --format=json |
              jq -r '[.[] | (.jsonPayload.code // (try (.textPayload | fromjson).code) // empty) | select(test("^[A-Z0-9_]{2,32}$"))] | unique | .[]'
            exit 1
          fi
          accepted_migrator="$registry/migrator@$digest"
          MATRIXKEEP_EXERCISE_STAGING_DELIVERY=true source deploy/staging-mail-worker.sh
          gcloud run jobs execute "$job" "${common[@]}" --wait
          jq -n --arg sha "$GITHUB_SHA" --arg worker "$repo@$digest" --arg migrator "$accepted_migrator" \
            '{sha:$sha,worker:$worker,migrator:$migrator}' > mail-release.json
      - uses: actions/upload-artifact@v4
        if: (github.ref == 'refs/heads/release/matrixkeep-cloud-run' && startsWith(github.event.head_commit.message, '[staging-mail-only]')) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[mail-worker-release]'))
        with:
          name: matrixkeep-staging-mail-release
          path: mail-release.json
          if-no-files-found: error
      - name: Publish immutable release images
        if: "!((github.ref == 'refs/heads/release/matrixkeep-cloud-run' && startsWith(github.event.head_commit.message, '[staging-mail-only]')) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[mail-worker-release]')))"
        shell: bash
        run: |
          set -euo pipefail
          [[ $GCP_PROJECT_ID == matrixkeep-* ]]
          host="$REGION-docker.pkg.dev"
          gcloud auth configure-docker "$host" --quiet
          for target in runtime migrator; do
            name=$target
            if [[ $target == runtime ]]; then name=web; fi
            repo="$host/$GCP_PROJECT_ID/matrixkeep/$name"
            tag="$repo:$GITHUB_SHA"
            docker build --target "$target" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$tag" .
            docker push "$tag"
            digest=$(gcloud artifacts docker images describe "$tag" --format='value(image_summary.digest)')
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            field=IMAGE
            if [[ $target == migrator ]]; then field=MIGRATOR_IMAGE; fi
            echo "$field=$repo@$digest" >> "$GITHUB_ENV"
          done
      - name: Migrate staging, deploy and verify HTTPS health
        if: "!((github.ref == 'refs/heads/release/matrixkeep-cloud-run' && startsWith(github.event.head_commit.message, '[staging-mail-only]')) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[mail-worker-release]')))"
        run: bash deploy/cloud-run.sh
      - name: Configure service monitoring
        if: "!((github.ref == 'refs/heads/release/matrixkeep-cloud-run' && startsWith(github.event.head_commit.message, '[staging-mail-only]')) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[mail-worker-release]')))"
        env:
          MONITORING_CHANNEL: ${{ vars.MONITORING_CHANNEL }}
        run: python3 deploy/monitoring.py
      - uses: actions/upload-artifact@v4
        if: "!((github.ref == 'refs/heads/release/matrixkeep-cloud-run' && startsWith(github.event.head_commit.message, '[staging-mail-only]')) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[mail-worker-release]')))"
        with:
          name: matrixkeep-staging-release
          path: release.json
          if-no-files-found: error
