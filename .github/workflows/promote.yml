name: Promote verified MatrixKeep release
on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: Read serving identity, mail worker and scheduler for release certification
        type: boolean
        default: false
      recovered_release:
        description: Use a verified serving-release artifact from a successful recovery run
        type: boolean
        default: false
      website_sha:
        description: Website only (leave empty for normal releases)
        type: string
        required: false
      mail_only:
        description: Promote the accepted main mail worker and migration for production QA
        type: boolean
        default: false
      acceptance_only:
        description: Test the serving production revision without deploying or moving traffic
        type: boolean
        default: false
      billing_acceptance:
        description: Run private unpaid billing checks after deploying with customer billing disabled
        type: boolean
        default: false
      staging_run:
        description: Successful main staging workflow run ID
        required: true
        type: string
      acceptance:
        description: Evidence reference for staging functional acceptance, rotation and production backup
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: matrixkeep-production
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_only != true && inputs.recovered_release != true && inputs.website_sha == '' && github.ref == 'refs/heads/main' && inputs.acceptance_only != true && !inputs.mail_only
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      APP_ENV: production
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      EXPECTED_SUPABASE_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_ACCOUNT_ID }}
      LIVE_BILLING_VERIFIED: ${{ vars.LIVE_BILLING_VERIFIED || 'false' }}
      GOOGLE_CONNECTOR_VERIFIED: ${{ vars.GOOGLE_CONNECTOR_VERIFIED || 'false' }}
      MICROSOFT_CONNECTOR_VERIFIED: ${{ vars.MICROSOFT_CONNECTOR_VERIFIED || 'false' }}
      MIN_INSTANCES: ${{ vars.MIN_INSTANCES || '0' }}
      MAX_INSTANCES: ${{ vars.MAX_INSTANCES || '3' }}
      CONCURRENCY: ${{ vars.RUN_CONCURRENCY || '8' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the selected staging release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.staging_run }}
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: |
          set -euo pipefail
          [[ $RUN_ID =~ ^[0-9]+$ && -n $ACCEPTANCE ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$GITHUB_SHA" '.path == ".github/workflows/verify.yml" and .event == "push" and .head_branch == "main" and .head_sha == $sha and .status == "completed" and (.conclusion == "success" or .conclusion == "failure")' "$RUNNER_TEMP/run.json"
          attempt=$(jq -er .run_attempt "$RUNNER_TEMP/run.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$attempt/jobs" |
            jq -e 'any(.jobs[]; .name=="verify" and .conclusion=="success") and
              all(.jobs[]; .conclusion!="failure" or .name=="staging" or (.name|startswith("capture-acceptance / browser ("))) and
              any(.jobs[]; .name=="staging" and all(.steps[]; .conclusion!="failure" or .name=="Functional browser QA on the published deployment") and any(.steps[];
                .name=="Migrate staging, deploy and verify HTTPS health" and .conclusion=="success"))' >/dev/null
          gh run download "$RUN_ID" -n matrixkeep-staging-release -D "$RUNNER_TEMP/staging"
          jq -e --arg sha "$GITHUB_SHA" '.sha == $sha and .service == "matrixkeep-staging-web"' "$RUNNER_TEMP/staging/release.json"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify advertised AI features before promotion
        run: bash deploy/recovery/guard.sh production required
      - name: Copy the accepted image manifests without rebuilding
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/staging/release.json"
          stage=$(jq -er '.project' "$manifest")
          region=$(jq -er '.region' "$manifest")
          [[ $stage == matrixkeep-* && $GCP_PROJECT_ID == matrixkeep-* && $stage != "$GCP_PROJECT_ID" ]]
          echo "STAGING_PROJECT=$stage" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev,$region-docker.pkg.dev" --quiet
          for pair in web:image migrator:migrator; do
            name=${pair%:*}
            source=$(jq -er --arg field "${pair#*:}" '.[$field]' "$manifest")
            digest=${source##*@}
            [[ ${source%@*} == "$region-docker.pkg.dev/$stage/matrixkeep/$name" && $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            dest="$REGION-docker.pkg.dev/$GCP_PROJECT_ID/matrixkeep/$name"
            docker buildx imagetools create --prefer-index=false --tag "$dest:$GITHUB_SHA" "$source"
            actual=$(gcloud artifacts docker images describe "$dest:$GITHUB_SHA" --format='value(image_summary.digest)')
            [[ $actual == "$digest" ]]
            field=IMAGE
            if [[ $name == migrator ]]; then field=MIGRATOR_IMAGE; fi
            echo "$field=$dest@$digest" >> "$GITHUB_ENV"
          done
      - name: Migrate production, deploy and verify customer HTTPS
        run: bash deploy/cloud-run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: matrixkeep-production-release
          path: release.json
          if-no-files-found: error
      - name: Verify disabled-mode production billing
        if: inputs.billing_acceptance
        run: bash deploy/billing-acceptance.sh
      - name: Configure service monitoring
        env:
          MONITORING_CHANNEL: ${{ vars.MONITORING_CHANNEL }}
        run: python3 deploy/monitoring.py

  serving-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_only != true && inputs.recovered_release != true && inputs.website_sha == '' && github.ref == 'refs/heads/main' && inputs.acceptance_only && !inputs.mail_only
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      APP_ENV: production
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_ACCOUNT_ID }}
      LIVE_BILLING_VERIFIED: ${{ vars.LIVE_BILLING_VERIFIED || 'false' }}
      EXPECTED_SUPABASE_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Match serving revision to accepted main staging artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.staging_run }}
        run: |
          set -euo pipefail
          [[ $RUN_ID =~ ^[0-9]+$ && $GCP_PROJECT_ID == matrixkeep-production && $REGION == europe-west2 ]]
          state=$(gcloud run services describe matrixkeep-production-web --project="$GCP_PROJECT_ID" --region="$REGION" --format=json)
          revision=$(jq -er '[.status.traffic[]|select(.percent==100).revisionName]|select(length==1)|first' <<<"$state")
          sha=$(gcloud run revisions describe "$revision" --project="$GCP_PROJECT_ID" --region="$REGION" --format='value(metadata.labels.source-commit)')
          [[ $sha =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e --arg sha "$sha" '.head_sha==$sha and .event=="push" and .head_branch=="main" and .path==".github/workflows/verify.yml" and .conclusion=="success"' >/dev/null
          gh run download "$RUN_ID" -n matrixkeep-staging-release -D "$RUNNER_TEMP/accepted"
          manifest="$RUNNER_TEMP/accepted/release.json"
          jq -e --arg sha "$sha" '.sha==$sha and .project=="matrixkeep-staging" and .service=="matrixkeep-staging-web"' "$manifest" >/dev/null
          for pair in web:image migrator:migrator; do
            name=${pair%:*}
            digest=$(jq -er --arg k "${pair#*:}" '.[$k] | split("@") | last | select(test("^sha256:[0-9a-f]{64}$"))' "$manifest")
            key=IMAGE
            if [[ $name == migrator ]]; then key=MIGRATOR_IMAGE; fi
            echo "$key=$REGION-docker.pkg.dev/$GCP_PROJECT_ID/matrixkeep/$name@$digest" >> "$GITHUB_ENV"
          done
          jq -n --arg revision "$revision" '{revision:$revision}' > release.json
      - name: Private acceptance against existing production artifacts
        run: bash deploy/billing-acceptance.sh

  mail:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_only != true && inputs.recovered_release != true && inputs.website_sha == '' && github.ref == 'refs/heads/main' && inputs.mail_only
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      EXPECTED_SUPABASE_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact accepted main mail release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.staging_run }}
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: |
          set -euo pipefail
          [[ $RUN_ID =~ ^[0-9]+$ && -n $ACCEPTANCE ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e --arg sha "$GITHUB_SHA" '.path == ".github/workflows/verify.yml" and .event == "push" and .head_branch == "main" and .head_sha == $sha and .conclusion == "success"'
          gh run download "$RUN_ID" -n matrixkeep-staging-mail-release -D "$RUNNER_TEMP/staging"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: bash deploy/production-mail-worker.sh

  website-production:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_only != true && inputs.recovered_release != true && github.ref == 'refs/heads/main' && inputs.website_sha != ''
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      WEBSITE_SHA: ${{ inputs.website_sha }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      TARGET: production
      STAGING_RUN: ${{ inputs.staging_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact protected staging run and acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE: ${{ inputs.acceptance }}
          CONFLICT: ${{ inputs.mail_only || inputs.billing_acceptance || inputs.acceptance_only }}
        run: |
          set -euo pipefail
          [[ $WEBSITE_SHA == 25bcf726503b7d8dbbe90a3e82064a9daf5c0297 && $CONFLICT == false && $STAGING_RUN =~ ^[0-9]+$ && -n $ACCEPTANCE ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN" | jq -e '
            .path==".github/workflows/verify.yml" and .event=="push" and
            .head_branch=="release/matrixkeep-cloud-run" and
            .head_sha=="91d0efaa548e07d396e38237cdb4c1741904f1b4" and .conclusion=="success"' >/dev/null
          gh run download "$STAGING_RUN" --name matrixkeep-website-staging --dir accepted
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy only the web image
        working-directory: .
        run: bash deploy/website-only.sh
      - uses: actions/upload-artifact@v4
        with:
          name: matrixkeep-website-${{ env.TARGET }}
          path: website.json
          if-no-files-found: error

  capture-acceptance:
    needs: promote
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-browser-qa.yml
    secrets:
      CAPTURE_QA_INDIVIDUAL_PASSWORD: ${{ secrets.CAPTURE_QA_INDIVIDUAL_PASSWORD }}
      CAPTURE_QA_BUSINESS_PASSWORD: ${{ secrets.CAPTURE_QA_BUSINESS_PASSWORD }}
    with:
      target: production

  request-witness:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.audit_only != true && inputs.recovered_release && !inputs.mail_only && !inputs.acceptance_only && !inputs.billing_acceptance && inputs.website_sha == ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: write
    outputs:
      witness_run: ${{ steps.witness.outputs.run }}
    steps:
      - id: witness
        name: Request the protected staging identity to recheck the serving release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN: ${{ inputs.staging_run }}
        run: |
          set -euo pipefail
          [[ $RECOVERY_RUN =~ ^[0-9]+$ ]]
          api="repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/dispatches"
          response=$(gh api -X POST "$api" -f ref=main -f "inputs[promotion_run]=$GITHUB_RUN_ID" -f "inputs[recovery_run]=$RECOVERY_RUN" -F return_run_details=true)
          witness=$(jq -er '.workflow_run_id|select(type=="number")' <<<"$response")
          echo "run=$witness" >> "$GITHUB_OUTPUT"
          for attempt in {1..60}; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$witness/jobs")
            if jq -e 'any(.jobs[];.name=="witness" and .status=="completed")' <<<"$result" >/dev/null; then
              jq -e 'any(.jobs[];.name=="witness" and .conclusion=="success")' <<<"$result" >/dev/null
              exit 0
            fi
            sleep 10
          done
          exit 1

  recover-production:
    needs: request-witness
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.audit_only != true && inputs.recovered_release && !inputs.mail_only && !inputs.acceptance_only && !inputs.billing_acceptance && inputs.website_sha == ''
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    env:
      RECOVERY_RUN: ${{ inputs.staging_run }}
      APP_ENV: production
      STAGING_PROJECT: matrixkeep-staging
      REGION: europe-west2
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      EXPECTED_SUPABASE_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_ACCOUNT_ID }}
      LIVE_BILLING_VERIFIED: ${{ vars.LIVE_BILLING_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify original staging recovery and owner acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: |
          set -euo pipefail
          [[ $RECOVERY_RUN =~ ^[0-9]+$ && -n $ACCEPTANCE ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN" | jq -e '
            .path==".github/workflows/verify.yml" and .event=="push" and .head_branch=="main" and .conclusion=="success"
          ' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN/jobs" | jq -e 'any(.jobs[]; .name=="recover" and .conclusion=="success")' >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: matrixkeep-recovered-staging-release
          path: accepted
          github-token: ${{ github.token }}
          run-id: ${{ inputs.staging_run }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.request-witness.outputs.witness_run }}
          name: matrixkeep-live-witness-${{ github.run_id }}
          path: witness
      - id: source
        run: |
          set -euo pipefail
          jq -e --slurpfile req deploy/recovery/request.json '.sha==$req[0].sha and .digest==$req[0].digest and .revision==$req[0].revision and .staging_run==$req[0].staging_run and .functional_acceptance==$req[0].acceptance' accepted/release.json >/dev/null
          sha=$(jq -er '.sha|select(test("^[0-9a-f]{40}$"))' accepted/release.json)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: application
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: bash deploy/recovery/promote.sh
      - uses: actions/upload-artifact@v4
        with:
          name: matrixkeep-production-release
          path: application/release.json
          if-no-files-found: error


  recovered-capture-acceptance:
    needs: recover-production
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-browser-qa.yml
    secrets:
      CAPTURE_QA_INDIVIDUAL_PASSWORD: ${{ secrets.CAPTURE_QA_INDIVIDUAL_PASSWORD }}
      CAPTURE_QA_BUSINESS_PASSWORD: ${{ secrets.CAPTURE_QA_BUSINESS_PASSWORD }}
    with:
      target: production

  audit-serving-release:
    if: github.ref == 'refs/heads/main' && inputs.audit_only
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read production serving identity and mail status
        run: bash deploy/recovery/read-serving.sh
