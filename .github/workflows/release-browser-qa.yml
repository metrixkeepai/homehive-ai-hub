name: Customer capture release acceptance
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
    secrets:
      CAPTURE_QA_INDIVIDUAL_PASSWORD:
        required: false
      CAPTURE_QA_BUSINESS_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        options: [staging, production]
permissions:
  contents: read
  id-token: write
jobs:
  browser:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'staging' || inputs.target == 'production')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    strategy:
      fail-fast: false
      matrix:
        role: [individual, business]
    concurrency: capture-acceptance-${{ inputs.target }}-${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg python3-pil
          bun x playwright install --with-deps chromium
      - name: Authenticate for private fixture access
        id: fixture_auth
        if: vars.CAPTURE_QA_AUDIO_OBJECT != '' && vars.CAPTURE_QA_AUDIO_SHA256 != ''
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CAPTURE_QA_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CAPTURE_QA_FIXTURE_READER }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_only
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify private recording and prepare browser input
        id: fixture
        if: steps.fixture_auth.outcome == 'success'
        continue-on-error: true
        env:
          FIXTURE_TOKEN: ${{ steps.fixture_auth.outputs.access_token }}
          FIXTURE_OBJECT: ${{ vars.CAPTURE_QA_AUDIO_OBJECT }}
          FIXTURE_SHA256: ${{ vars.CAPTURE_QA_AUDIO_SHA256 }}
        run: python3 deploy/recovery/private-audio.py
      - name: Complete customer workflows and reopen saved records
        env:
          APP_ENV: ${{ inputs.target }}
          QA_ROLE: ${{ matrix.role }}
          QA_PASSWORD: ${{ secrets[inputs.target == 'production' && matrix.role == 'business' && 'CAPTURE_QA_INTERNAL_BUSINESS_PASSWORD' || format('CAPTURE_QA_{0}_PASSWORD', matrix.role == 'business' && 'BUSINESS' || 'INDIVIDUAL')] }}
          QA_HUMAN_AUDIO_PATH: ${{ steps.fixture.outputs.wav }}
        run: node deploy/recovery/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-browser-${{ inputs.target }}-${{ matrix.role }}
          path: browser-*.json
          if-no-files-found: error
      - name: Remove private runner audio
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/matrixkeep-qa-audio"
